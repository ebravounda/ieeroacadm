# Pegar dentro del bloque "server { ... }" del sitio iberoacademy.cl en aaPanel (Sitio > Configuración > Archivo de configuración)
# reemplazando la línea "root ..." y los "location /" existentes.

root /www/wwwroot/iberoacademy/frontend/build;
index index.html;
client_max_body_size 500m;

location /api/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location / {
    try_files $uri $uri/ /index.html;
}
