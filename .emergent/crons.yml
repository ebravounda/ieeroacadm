crons:
  - name: class-reminders
    description: "Envía recordatorio por correo a los estudiantes ~30 min antes de cada clase en vivo"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/class-reminders"
    method: POST
    enabled: true
  - name: inactivity-alerts
    description: "Correo diario 10:00 Chile a estudiantes sin ingresar hace 7 días, animándolos a continuar"
    cron: "0 10 * * *"
    timezone: "America/Santiago"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/inactivity-alerts"
    method: POST
    enabled: true
  - name: weekly-otec-report
    description: "Envía el reporte OTEC de todos los cursos a los administradores cada lunes 08:00 Chile"
    cron: "0 8 * * 1"
    timezone: "America/Santiago"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/weekly-report"
    method: POST
    enabled: true
